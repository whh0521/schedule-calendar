<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조원 일정 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centered column — header, month calendar grid, then ranked date list */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #18241f;
  --muted: #5f6d66;
  --line: #d9e0db;
  --accent: #1f6b52;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe6;
  --mine: #f2c14e;
  --mine-soft: #fdf3d8;
  --sun: #c2453a;
  --sat: #2f5fa8;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --surface: #18201c; --ink: #e6ede9; --muted: #98a69f; --line: #2c3833;
    --accent: #5cc49b; --accent-ink: #0d1612; --accent-soft: #1d3a2e;
    --mine: #e8b83f; --mine-soft: #3a3120; --sun: #ef7d72; --sat: #7ea6ec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111714; --surface: #18201c; --ink: #e6ede9; --muted: #98a69f; --line: #2c3833;
  --accent: #5cc49b; --accent-ink: #0d1612; --accent-soft: #1d3a2e;
  --mine: #e8b83f; --mine-soft: #3a3120; --sun: #ef7d72; --sat: #7ea6ec;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Name step */
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: grid; gap: 18px; max-width: 460px; width: 100%; margin: 6vh auto 0; }
.intro form { display: flex; gap: 8px; flex-wrap: wrap; }
.intro input { flex: 1 1 180px; min-width: 0; font: inherit; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.group-chip { display: inline-block; font-size: .8rem; font-weight: 600; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; justify-self: start; }
.maker { border-top: 1px solid var(--line); padding-top: 14px; font-size: .9rem; }
.maker summary { cursor: pointer; color: var(--muted); }
.maker .fields { display: grid; gap: 8px; margin-top: 12px; }
.maker label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
.maker input { flex: none; width: 100%; }
.maker .out { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.maker code { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: .78rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.notice { font-size: .88rem; padding: 10px 12px; border-radius: 10px; background: var(--mine-soft); color: var(--ink); }

/* Calendar step */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who .tag { background: var(--mine-soft); border: 1px solid var(--mine); padding: 3px 10px; border-radius: 999px; font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: .88rem; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.cal-head { display: flex; align-items: center; justify-content: center; gap: 8px; padding-block: 4px; }
.cal-head h2 { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.nav { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 1.1rem; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: .78rem; font-weight: 600; color: var(--muted); padding: 2px 0; letter-spacing: .04em; }
.dow.sun { color: var(--sun); } .dow.sat { color: var(--sat); }
.day {
  position: relative; min-height: 92px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  padding: 5px 5px 22px; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.day.empty { visibility: hidden; }
.day.past { opacity: .45; cursor: default; }
.day .num { font-family: var(--font-mono); font-weight: 600; font-size: .85rem; font-variant-numeric: tabular-nums; }
.day.sun .num { color: var(--sun); } .day.sat .num { color: var(--sat); }
.day.today .num { text-decoration: underline; text-underline-offset: 3px; }
.day.mine { background: var(--mine-soft); border-color: var(--mine); box-shadow: inset 0 0 0 1px var(--mine); }
.day .names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.day .nm { font-size: .72rem; line-height: 1.3; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .nm.me { background: var(--mine); color: #2a2208; font-weight: 600; }
.day .more { font-size: .7rem; color: var(--muted); padding-left: 2px; }
.day .count {
  position: absolute; right: 5px; bottom: 4px; font-size: .72rem; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; line-height: 1.5;
}
.day.best .count { background: var(--sun); color: #fff; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-mine::before { background: var(--mine); }
.legend .l-best::before { background: var(--sun); }
.status { font-size: .88rem; color: var(--muted); }
.status.dirty { color: var(--sun); font-weight: 600; }

.rank { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.rank ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rank li { display: grid; grid-template-columns: 7.5em 3.2em minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.rank li:first-child { border-top: 0; }
.rank .d { font-weight: 600; font-variant-numeric: tabular-nums; }
.rank .c { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
.rank .ppl { color: var(--muted); font-size: .9rem; min-width: 0; overflow-wrap: anywhere; }
.people { font-size: .88rem; color: var(--muted); }

@media (max-width: 560px) {
  .day { min-height: 74px; padding: 3px 3px 20px; border-radius: 6px; }
  .day .nm { font-size: .64rem; padding: 0 3px; }
  .day .count { font-size: .66rem; padding: 0 5px; right: 3px; bottom: 3px; }
  .cal { padding: 10px 8px; }
  .grid { gap: 3px; }
  .rank li { grid-template-columns: 6.6em 2.8em minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- Step 1: name -->
  <section class="intro" id="step-name">
    <div style="display:grid;gap:6px">
      <span class="group-chip" id="group-chip"></span>
      <h1 id="page-title">조원 일정 맞추기</h1>
      <p class="muted">이름을 적고 들어가서 가능한 날짜를 모두 눌러 주세요. 같은 이름으로 다시 들어오면 내가 고른 날짜를 고칠 수 있어요.</p>
    </div>
    <form id="name-form" autocomplete="off">
      <input id="name-input" type="text" maxlength="20" placeholder="이름 (예: 김민지)" aria-label="이름">
      <button class="btn" id="name-go" type="submit">달력으로 이동</button>
    </form>
    <p class="notice" id="db-notice" hidden></p>
    <details class="maker">
      <summary>다른 그룹용 링크 만들기</summary>
      <div class="fields">
        <label for="mk-group">그룹 이름
          <input id="mk-group" type="text" maxlength="30" placeholder="예: 3조, 동아리">
        </label>
        <label for="mk-month">달력에 보여 줄 달
          <input id="mk-month" type="month">
        </label>
        <div class="out">
          <code id="mk-link">그룹 이름을 적으면 링크가 만들어져요</code>
          <button class="btn btn-ghost" id="mk-copy" type="button" disabled>복사</button>
        </div>
      </div>
    </details>
  </section>

  <!-- Step 2: calendar -->
  <section id="step-cal" hidden style="display:grid;gap:16px">
    <div class="top">
      <div class="who">
        <span class="tag" id="me-tag"></span>
        <span class="muted" style="font-size:.9rem">님, 가능한 날짜를 눌러 체크하세요</span>
        <button class="linkbtn" id="change-name" type="button">이름 바꾸기</button>
      </div>
      <p class="people" id="people"></p>
    </div>

    <div class="cal">
      <div class="cal-head">
        <h2 id="month-label"></h2>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="bar">
      <div class="legend"><span class="l-mine">내가 체크한 날</span><span class="l-best">가장 많이 가능한 날</span></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="status" id="status"></span>
        <button class="btn btn-ghost" id="reset" type="button">되돌리기</button>
        <button class="btn" id="save" type="button">체크 완료</button>
      </div>
    </div>

    <section class="rank">
      <h2>가능 인원이 많은 날</h2>
      <ol id="rank"></ol>
      <p class="muted" id="rank-empty" style="font-size:.9rem">아직 체크한 사람이 없어요. 날짜를 고르고 ‘체크 완료’를 누르면 여기에 순위가 나타나요.</p>
    </section>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const today = new Date();
  const todayKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());

  // ▼▼▼ 구글 Apps Script 웹 앱 URL을 여기에 붙여 넣으세요 (README 참고) ▼▼▼
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUNwXDKgd0snCOGq-dtAXbkxWwzayFCxLJ4-aBxHPdoW6guhENOx3L6DQyLdklYL67/exec";
  // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
  const POLL_MS = 15000;     // 다른 사람 체크를 15초마다 새로 불러옴
  let ready = false;         // 시트에서 처음 불러오기에 성공했는지

  let votes = [];            // [{name, dates:[...]}] from the store
  let me = "";               // current name
  let mine = new Set();      // my working selection
  let savedMine = new Set(); // my saved selection
  // ---------- 링크로 그룹과 달 정하기: ?g=3조&m=2026-12 ----------
  const params = new URLSearchParams(location.search);
  const GROUP = (params.get("g") || "").trim().replace(/\s+/g, " ").slice(0, 30) || "기본";
  const view = (() => {
    const mm = /^(\d{4})-(\d{1,2})$/.exec(params.get("m") || "");
    if (mm && +mm[2] >= 1 && +mm[2] <= 12) return { y: +mm[1], m: +mm[2] - 1 };
    return { y: today.getFullYear(), m: today.getMonth() };
  })();
  const NAME_KEY = "sched-name:" + GROUP;
  let saving = false;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  function setsEqual(a, b) { if (a.size !== b.size) return false; for (const x of a) if (!b.has(x)) return false; return true; }

  // ---------- Step switching ----------
  function showName() {
    $("step-cal").hidden = true; $("step-name").hidden = false;
    $("name-input").value = me || store.get(NAME_KEY) || "";
    $("name-input").focus();
  }
  function showCal() {
    $("step-name").hidden = true; $("step-cal").hidden = false;
    $("me-tag").textContent = me;
    loadMine();
    render();
  }
  function loadMine() {
    const rec = votes.find(v => v.name === me);
    savedMine = new Set(rec ? rec.dates : []);
    mine = new Set(savedMine);
  }

  $("name-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const n = $("name-input").value.trim().replace(/\s+/g, " ");
    if (!n) { $("name-input").focus(); return; }
    me = n; store.set(NAME_KEY, n);
    showCal();
  });
  $("change-name").addEventListener("click", showName);

  // ---------- Calendar ----------
  function countsByDate() {
    const map = new Map();
    for (const v of votes) {
      if (v.name === me) continue; // mine comes from the working selection
      for (const d of v.dates) { if (!map.has(d)) map.set(d, []); map.get(d).push(v.name); }
    }
    for (const d of mine) { if (!map.has(d)) map.set(d, []); map.get(d).push(me); }
    for (const list of map.values()) list.sort((a, b) => (a === me ? -1 : b === me ? 1 : a.localeCompare(b, "ko")));
    return map;
  }

  function render() {
    if ($("step-cal").hidden) return;
    const map = countsByDate();
    let max = 0; for (const l of map.values()) max = Math.max(max, l.length);

    const { y, m } = view;
    $("month-label").textContent = `${y}년 ${m + 1}월`;
    const grid = $("grid");
    grid.textContent = "";
    DOW.forEach((d, i) => {
      const el = document.createElement("div");
      el.className = "dow" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
      el.textContent = d; grid.appendChild(el);
    });
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) { const e = document.createElement("div"); e.className = "day empty"; grid.appendChild(e); }
    for (let d = 1; d <= days; d++) {
      const k = keyOf(y, m, d);
      const dow = (first + d - 1) % 7;
      const names = map.get(k) || [];
      const past = k < todayKey;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "day" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "") + (k === todayKey ? " today" : "") +
        (mine.has(k) ? " mine" : "") + (past ? " past" : "") + (names.length && names.length === max && max > 1 ? " best" : "");
      b.setAttribute("aria-pressed", mine.has(k) ? "true" : "false");
      b.setAttribute("aria-label", `${m + 1}월 ${d}일, ${names.length}명 가능${mine.has(k) ? ", 내가 체크함" : ""}`);
      if (past) b.disabled = true;
      const num = document.createElement("span"); num.className = "num"; num.textContent = d; b.appendChild(num);
      if (names.length) {
        const wrap = document.createElement("span"); wrap.className = "names";
        const shown = names.slice(0, 3);
        for (const n of shown) {
          const t = document.createElement("span"); t.className = "nm" + (n === me ? " me" : ""); t.textContent = n; t.title = n; wrap.appendChild(t);
        }
        if (names.length > shown.length) {
          const more = document.createElement("span"); more.className = "more"; more.textContent = `외 ${names.length - shown.length}명`; wrap.appendChild(more);
        }
        b.appendChild(wrap);
        const c = document.createElement("span"); c.className = "count"; c.textContent = `${names.length}명`; b.appendChild(c);
      }
      b.addEventListener("click", () => {
        if (mine.has(k)) mine.delete(k); else mine.add(k);
        render();
      });
      grid.appendChild(b);
    }

    // People + status
    const allNames = new Set(votes.map(v => v.name)); if (mine.size) allNames.add(me);
    $("people").textContent = allNames.size ? `참여 ${allNames.size}명: ${[...allNames].sort((a, b) => a.localeCompare(b, "ko")).join(", ")}` : "아직 참여한 사람이 없어요";

    const dirty = !setsEqual(mine, savedMine);
    const st = $("status");
    st.className = "status" + (dirty ? " dirty" : "");
    st.textContent = !ready ? "일정을 불러오는 중…" : saving ? "저장하는 중…" : dirty ? "저장되지 않은 변경이 있어요" : (savedMine.size ? `${savedMine.size}일 저장됨` : "");
    $("save").disabled = !ready || !dirty || saving;
    $("reset").disabled = !dirty || saving;

    // Ranking
    const ranked = [...map.entries()].filter(([, l]) => l.length).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0])).slice(0, 10);
    const ol = $("rank"); ol.textContent = "";
    $("rank-empty").hidden = ranked.length > 0;
    for (const [k, l] of ranked) {
      const [yy, mm, dd] = k.split("-").map(Number);
      const li = document.createElement("li");
      const dEl = document.createElement("span"); dEl.className = "d"; dEl.textContent = `${mm}/${dd} (${DOW[new Date(yy, mm - 1, dd).getDay()]})`;
      const cEl = document.createElement("span"); cEl.className = "c"; cEl.textContent = `${l.length}명`;
      const pEl = document.createElement("span"); pEl.className = "ppl"; pEl.textContent = l.join(", ");
      li.append(dEl, cEl, pEl); ol.appendChild(li);
    }
  }

  $("reset").addEventListener("click", () => { mine = new Set(savedMine); render(); });

  $("save").addEventListener("click", async () => {
    if (!ready || saving) return;
    saving = true; render();
    const dates = [...mine].sort();
    try {
      // text/plain으로 보내야 브라우저 사전 요청(CORS preflight) 없이 Apps Script에 전달됨
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ group: GROUP, name: me, dates }),
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "save failed");
      applyVotes(json.votes, true);
      saving = false; render();
      $("status").textContent = "저장했어요";
    } catch (e) {
      saving = false; render();
      const st = $("status"); st.className = "status dirty";
      st.textContent = "저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
    }
  });

  // ---------- Google Sheets (Apps Script) ----------
  function applyVotes(list, forceMine) {
    votes = (Array.isArray(list) ? list : [])
      .filter(v => v && typeof v.name === "string" && Array.isArray(v.dates))
      .map(v => ({ name: v.name, dates: v.dates.filter(x => typeof x === "string") }));
    const rec = votes.find(v => v.name === me);
    const newSaved = new Set(rec ? rec.dates : []);
    const wasClean = setsEqual(mine, savedMine);
    savedMine = newSaved;
    if (forceMine || (wasClean && !saving)) mine = new Set(newSaved);
  }

  async function load() {
    if (saving || document.hidden) return;
    try {
      const res = await fetch(SCRIPT_URL + "?g=" + encodeURIComponent(GROUP) + "&t=" + Date.now());
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "load failed");
      applyVotes(json.votes, false);
      ready = true;
      $("db-notice").hidden = true;
      render();
    } catch (e) {
      if (!ready) showNotice("일정 데이터를 불러오지 못했어요. 잠시 후 페이지를 새로 고침해 주세요.");
    }
  }

  function connect() {
    if (!SCRIPT_URL) {
      showNotice("아직 구글시트가 연결되지 않았어요. index.html의 SCRIPT_URL을 채워 주세요.");
      return;
    }
    load();
    setInterval(load, POLL_MS);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  }
  function showNotice(t) { const n = $("db-notice"); n.textContent = t; n.hidden = false; const s = $("status"); if (s) s.textContent = t; }

  // ---------- 그룹 표시 + 새 링크 만들기 ----------
  const monthLabel = `${view.y}년 ${view.m + 1}월`;
  $("group-chip").textContent = GROUP === "기본" ? monthLabel : `${GROUP} · ${monthLabel}`;
  if (GROUP !== "기본") { $("page-title").textContent = `${GROUP} 일정 맞추기`; document.title = `${GROUP} 일정 맞추기`; }

  $("mk-month").value = `${view.y}-${pad(view.m + 1)}`;
  let madeLink = "";
  function makeLink() {
    const g = $("mk-group").value.trim().replace(/\s+/g, " ");
    const m = $("mk-month").value;
    if (!g) { madeLink = ""; $("mk-link").textContent = "그룹 이름을 적으면 링크가 만들어져요"; $("mk-copy").disabled = true; return; }
    const u = new URL(location.href.split("?")[0].split("#")[0]);
    u.searchParams.set("g", g);
    if (m) u.searchParams.set("m", m);
    madeLink = u.toString();
    $("mk-link").textContent = madeLink;
    $("mk-copy").disabled = false; $("mk-copy").textContent = "복사";
  }
  $("mk-group").addEventListener("input", makeLink);
  $("mk-month").addEventListener("input", makeLink);
  $("mk-copy").addEventListener("click", async () => {
    if (!madeLink) return;
    try { await navigator.clipboard.writeText(madeLink); $("mk-copy").textContent = "복사됨"; }
    catch { const r = document.createRange(); r.selectNodeContents($("mk-link")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  });

  showName();
  connect();
})();
</script>
</body>
</html>
